<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MiniPupper Web Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status.disconnected {
            background-color: #ff4444;
        }

        .status.connecting {
            background-color: #ffaa00;
        }

        .status.connected {
            background-color: #44ff44;
            color: #000;
        }

        .connect-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .connect-btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .connect-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
            transform: none;
        }

        .controls {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .controls.active {
            display: block;
        }

        .joysticks {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .joystick-container {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .joystick-label {
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .joystick {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            margin: 0 auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .joystick-stick {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffffff, #cccccc);
            border: 3px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: move;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: box-shadow 0.1s;
        }

        .joystick-stick:active {
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .button {
            padding: 15px;
            font-size: 1em;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .button:active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .button.toggle-on {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            margin: 20px auto;
            width: fit-content;
        }

        .dpad-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .dpad-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .dpad-btn.empty {
            visibility: hidden;
        }

        .info {
            color: white;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 0.9em;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        @media (max-width: 600px) {
            .joystick {
                width: 150px;
                height: 150px;
            }
            
            .joystick-stick {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕 MiniPupper Controller</h1>
            <div class="status disconnected" id="status">Disconnected</div>
            <br>
            <button class="connect-btn" id="connectBtn">Connect via Bluetooth</button>
        </div>

        <div class="controls" id="controls">
            <div class="joysticks">
                <div class="joystick-container">
                    <div class="joystick-label">Left Stick (Movement)</div>
                    <div class="joystick" id="leftJoystick">
                        <div class="joystick-stick" id="leftStick"></div>
                    </div>
                </div>
                <div class="joystick-container">
                    <div class="joystick-label">Right Stick (Yaw/Pitch)</div>
                    <div class="joystick" id="rightJoystick">
                        <div class="joystick-stick" id="rightStick"></div>
                    </div>
                </div>
            </div>

            <div class="joystick-label">D-Pad (Height/Roll)</div>
            <div class="dpad">
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dpad="up">▲</div>
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dpad="left">◄</div>
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dpad="right">►</div>
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dpad="down">▼</div>
                <div class="dpad-btn empty"></div>
            </div>

            <div class="buttons">
                <button class="button" id="btnL1">L1 (Activate)</button>
                <button class="button" id="btnR1">R1 (Trot)</button>
                <button class="button" id="btnX">X (Hop)</button>
                <button class="button" id="btnCircle">○ (Dance)</button>
                <button class="button" id="btnTriangle">△ (Shutdown)</button>
            </div>

            <div class="info">
                <div class="info-row">
                    <span>Left Stick:</span>
                    <span id="infoLeft">X: 0.00, Y: 0.00</span>
                </div>
                <div class="info-row">
                    <span>Right Stick:</span>
                    <span id="infoRight">X: 0.00, Y: 0.00</span>
                </div>
                <div class="info-row">
                    <span>D-Pad:</span>
                    <span id="infoDpad">X: 0, Y: 0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="controller.js"></script>
</body>
</html>
